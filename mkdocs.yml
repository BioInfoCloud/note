# [Extensions]
plugins:
  - search: # 现在还不支持中文搜索 支持之后可以设置语言
    # insider已经支持中文的分词搜索了 https://squidfunk.github.io/mkdocs-material/blog/2022/chinese-search-support/
      lang:
        - en
        - ja
  - tags # 给单篇文章添加标签 https://squidfunk.github.io/mkdocs-material/setup/setting-up-tags/?h=tags

# [Redirects] 目录/文件由中文改名为英文后，为旧地址生成跳转页（映射见 hooks/redirects.json）
hooks:
  - hooks/redirect_site.py

markdown_extensions:
  - pymdownx.arithmatex: # latex支持
      generic: true
  - attr_list # 给图片后面添加{width="300"}设置大小
  - admonition # 提示框
  - footnotes # 脚注([^1] 语法)，避免被误判为失效链接
  - md_in_html # 在 HTML 块中使用 Markdown
  - toc:
      permalink: true # 固定标题位置为当前位置
      toc_depth: 3
  - pymdownx.highlight: # 代码块高亮
      # linenums: true # 显示行号
      # auto_title: true # 显示编程语言名称
      anchor_linenums: true
  - pymdownx.superfences # 代码块高亮插件
  - pymdownx.details # 可折叠的提示框
  - pymdownx.tabbed: # 内容分栏切换
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji: # 图标 / 表情
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - meta # 支持Markdown文件上方自定义标题标签等
extra_javascript:
  # latex支持
  # check https://squidfunk.github.io/mkdocs-material/reference/mathjax/?h=math for more information
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/progress.js # 阅读进度条（顶部极光渐变细条）
extra_css:
  - assets/stylesheets/extra.css # 站点整体视觉样式（清新浅色科技感）
  - assets/stylesheets/premium.css # 进阶质感升级层（叠加在 extra.css 之上，统一覆盖全站页面）
