# [Info]
site_name: 生物信息云 # 左上角标题
site_url: https://bioinfocloud.io
site_author: DoubleHelix
site_description: 生物信息云

# [UI]
## [top]
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  plugins:
  - social: 
      cards_font: Noto Sans SC
  palette:
    # 清新浅色主题：白底 + 品牌青绿/天蓝点缀，logo 在浅底上醒目
    scheme: default
    primary: custom # 具体色值在 assets/stylesheets/extra.css 中定义
    accent: custom
  font: false # 关闭 Google Fonts，改用系统字体栈（加载更快，中文显示更好）
  features:
    - navigation.tabs # 使用Tab来进行分类
    - navigation.tabs.sticky # 滚动时 Tab 吸顶
    - navigation.top # 返回顶部的按钮 在上滑时出现
    - navigation.indexes # Tab会有一个index.md 而不是在打开Tab时打开第一篇文章
    - navigation.expand # 打开Tab时左侧目录全部 展开
    - navigation.tracking # 地址栏随滚动更新锚点
    - toc.follow # 右侧目录跟随正文高亮
    - search.suggest # 搜索输入一些字母时推荐补全整个单词
    - search.highlight # 搜索出的文章关键词加入高亮
    - search.share # 搜索结果可分享
    - content.code.copy # 代码块一键复制
    - content.code.select # 代码块按行选择
    - content.tabs.link # 多语言/多方案 Tab 联动
    - content.tooltips # 脚注/缩写悬浮提示
  language: zh # 一些提示性的文字会变成中文
  icon:
    repo: fontawesome/brands/github
edit_uri: edit/main/docs # 编辑按钮跳转的链接
## [top-right corner]
repo_url: https://github.com/BioInfoCloud/note # 右上角点击跳转的链接
repo_name: BioInfoCloud # 右上角的名字
## [bottom-left corner]
copyright: Copyright &copy; 2022 - 2025 DoubleHelix · 生物信息云
## [bottom-right corner]
extra:
  social: # icons
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/434318322
      name: Bilibili | BioInfoCloud # 鼠标悬浮提示
    - icon: fontawesome/brands/github
      link: https://github.com/BioInfoCloud
      name: GitHub | BioInfoCloud
    - icon: fontawesome/brands/weixin
      link: https://bioinfocloud.io
      name: 微信公众号 | 生物信息云
  generator: true

